name: Update profile activity

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/update-readme.yml'

concurrency:
  group: profile-readme-writes
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-readme:
    if: github.repository == 'CodaxiKing/CodaxiKing'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      # Listed in awesome-github-profile-readme under Tools.
      - name: Update recent public activity
        uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          GH_USERNAME: CodaxiKing
          TARGET_FILE: README.md
          MAX_LINES: '5'
          FILTER_EVENTS: IssueCommentEvent,IssuesEvent,PullRequestEvent,ReleaseEvent
          COMMIT_MSG: 'docs: update recent GitHub activity'
